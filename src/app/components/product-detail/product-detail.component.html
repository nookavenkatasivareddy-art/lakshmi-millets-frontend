<section class="container detail-page" *ngIf="product">
  <div class="detail-grid">
    <div class="detail-img card">
      <img [src]="product.image | imageUrl:'products'" [alt]="product.name" onerror="this.src='assets/images/placeholder.jpg'">
    </div>
    <div class="detail-info">
      <h2>{{ product.name }}</h2>
      <p class="weight">{{ product.weight }}</p>
      <div class="product-price">
        <span class="price big">₹{{ product.price }}</span>
        <span class="mrp">₹{{ product.mrp }}</span>
        <span class="badge in-stock" *ngIf="product.stock > 5">In Stock</span>
        <span class="badge low-stock" *ngIf="product.stock > 0 && product.stock <= 5">Only {{ product.stock }} left</span>
        <span class="badge out-of-stock" *ngIf="product.stock <= 0">Out of Stock</span>
      </div>
      <p class="description">{{ product.description }}</p>

      <div class="qty-row" *ngIf="product.stock > 0">
        <label>Quantity</label>
        <div class="qty-selector">
          <button (click)="changeQty(-1)" [disabled]="quantity <= 1">−</button>
          <span>{{ quantity }}</span>
          <button (click)="changeQty(1)" [disabled]="quantity >= product.stock">+</button>
        </div>
      </div>

      <div class="action-row">
        <button class="btn btn-outline" [disabled]="product.stock <= 0" (click)="addToCart()">🛒 Add to Cart</button>
        <button class="btn btn-primary" [disabled]="product.stock <= 0" (click)="buyNow()">
          {{ product.stock <= 0 ? 'Out of Stock' : 'Buy Now →' }}
        </button>
      </div>
    </div>
  </div>
</section>

<p class="container" *ngIf="!loading && !product">Product not found.</p>
